<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>שאלה 4</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="top-header">
      <div class="top-title">שאלה 4</div>
    </header>

    <section class="question-area">
      <h1>מטילים פעמיים מטבע הוגן. על צד אחד של המטבע רשום 'עץ' ועל הצד השני רשום 'פלי'. מהי ההסתברות לקבל בשתי ההטלות את אותו הצד?</h1>
    </section>

    <section class="visual-graphic">
      <svg width="280" height="180" viewBox="0 0 140 80">
        <!-- Main node starting point -->
        <circle cx="20" cy="40" r="3" fill="#112b4c" />
        <text x="12" y="47" font-size="4" font-weight="bold" fill="#112b4c" font-family="sans-serif">התחלה</text>
        
        <!-- First Branch Leaves -->
        <line x1="23" y1="40" x2="55" y2="20" stroke="#112b4c" stroke-width="0.5" />
        <line x1="23" y1="40" x2="55" y2="60" stroke="#112b4c" stroke-width="0.5" />
        
        <circle cx="55" cy="20" r="2.5" fill="#112b4c" />
        <text x="53" y="15" font-size="4.5" fill="#112b4c" font-family="sans-serif">עץ</text>
        <circle cx="55" cy="60" r="2.5" fill="#112b4c" />
        <text x="53" y="66" font-size="4.5" fill="#112b4c" font-family="sans-serif">פלי</text>

        <!-- Second level branches upper -->
        <line x1="57.5" y1="20" x2="95" y2="10" stroke="#112b4c" stroke-width="0.3" />
        <line x1="57.5" y1="20" x2="95" y2="30" stroke="#112b4c" stroke-width="0.3" />
        
        <circle cx="95" cy="10" r="2" fill="#112b4c" />
        <text x="99" y="11.5" font-size="4" fill="#112b4c" font-family="sans-serif">עץ</text>
        <circle cx="95" cy="30" r="2" fill="#112b4c" />
        <text x="99" y="31.5" font-size="4" fill="#112b4c" font-family="sans-serif">פלי</text>

        <!-- Second level branches lower -->
        <line x1="57.5" y1="60" x2="95" y2="50" stroke="#112b4c" stroke-width="0.3" />
        <line x1="57.5" y1="60" x2="95" y2="70" stroke="#112b4c" stroke-width="0.3" />
        
        <circle cx="95" cy="50" r="2" fill="#112b4c" />
        <text x="99" y="51.5" font-size="4" fill="#112b4c" font-family="sans-serif">עץ</text>
        <circle cx="95" cy="70" r="2" fill="#112b4c" />
        <text x="99" y="71.5" font-size="4" fill="#112b4c" font-family="sans-serif">פלי</text>
      </svg>
    </section>

    <section class="choices">
      <div class="choice">
        <span class="choice-letter">(א)</span>
        <span class="choice-text">1/4</span>
      </div>
      <div class="choice">
        <span class="choice-letter">(ב)</span>
        <span class="choice-text">1/2</span>
      </div>
      <div class="choice">
        <span class="choice-letter">(ג)</span>
        <span class="choice-text">3/4</span>
      </div>
      <div class="choice">
        <span class="choice-letter">(ד)</span>
        <span class="choice-text">1/3</span>
      </div>
    </section>

    <section class="solution-lines">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </section>

    <footer class="footer">
      <div class="footer-line"></div>
      <div class="footer-text">תחום וודאות</div>
    </footer>
  </main>
</body>
</html>
