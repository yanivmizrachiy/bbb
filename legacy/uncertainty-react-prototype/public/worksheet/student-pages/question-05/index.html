<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>שאלה 5</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="top-header">
      <div class="top-title">שאלה 5</div>
    </header>

    <section class="question-area">
      לפניכם גלגל מסתובב המחולק ל-8 גזרות שוות וזהות, הממוספרות מ-1 עד 8. מסובבים את הגלגל פעם אחת באקראי. מהי ההסתברות שהמחוג ייעצר על מספר ראשוני?
    </section>

    <section class="graphic-area">
      <svg width="180" height="180" viewBox="0 0 100 100">
        <!-- Main Circular Spinner Outer Ring -->
        <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#112b4c" stroke-width="0.7"/>
        
        <!-- Sector Lines -->
        <line x1="50" y1="2" x2="50" y2="98" stroke="#112b4c" stroke-width="0.5"/>
        <line x1="2" y1="50" x2="98" y2="50" stroke="#112b4c" stroke-width="0.5"/>
        <line x1="16" y1="16" x2="84" y2="84" stroke="#112b4c" stroke-width="0.5"/>
        <line x1="16" y1="84" x2="84" y2="16" stroke="#112b4c" stroke-width="0.5"/>
        
        <!-- Sector Numbers (1 to 8) -->
        <text x="68" y="28" font-size="6" font-family="sans-serif" text-anchor="middle" fill="#112b4c">1</text>
        <text x="80" y="47" font-size="6" font-family="sans-serif" text-anchor="middle" fill="#112b4c">2</text>
        <text x="73" y="69" font-size="6" font-family="sans-serif" text-anchor="middle" fill="#112b4c">3</text>
        <text x="50" y="80" font-size="6" font-family="sans-serif" text-anchor="middle" fill="#112b4c">4</text>
        <text x="27" y="69" font-size="6" font-family="sans-serif" text-anchor="middle" fill="#112b4c">5</text>
        <text x="20" y="47" font-size="6" font-family="sans-serif" text-anchor="middle" fill="#112b4c">6</text>
        <text x="28" y="28" font-size="6" font-family="sans-serif" text-anchor="middle" fill="#112b4c">7</text>
        <text x="50" y="22" font-size="6" font-family="sans-serif" text-anchor="middle" fill="#112b4c">8</text>
        
        <!-- Center arrow spinner pointer -->
        <circle cx="50" cy="50" r="3.5" fill="#112b4c"/>
        <polyline points="50,50 32,32" stroke="#172b46" stroke-width="1.2" stroke-linecap="round"/>
        <polygon points="30,30 38,32 32,38" fill="#172b46"/>
      </svg>
    </section>

    <section class="choices">
      <div class="choice">
        <span class="choice-letter">(א)</span>
        <span class="choice-text">1/2</span>
      </div>
      <div class="choice">
        <span class="choice-letter">(ב)</span>
        <span class="choice-text">3/8</span>
      </div>
      <div class="choice">
        <span class="choice-letter">(ג)</span>
        <span class="choice-text">5/8</span>
      </div>
      <div class="choice">
        <span class="choice-letter">(ד)</span>
        <span class="choice-text">1/4</span>
      </div>
    </section>

    <section class="solution-lines">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </section>

    <footer class="footer">
      <div class="footer-line"></div>
      <div class="footer-text">תחום וודאות</div>
    </footer>
  </main>
</body>
</html>
