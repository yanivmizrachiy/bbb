<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>שאלה 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="top-header">
      <div class="top-title">שאלה 2</div>
    </header>

    <section class="question-area">
      <h1>בכד מונחים שלושה כדורים כחולים, חמישה כדורים צהובים ושני כדורים ירוקים. מוציאים באקראי כדור אחד מהכד. מהי ההסתברות שהכדור שהוצא אינו ירוק?</h1>
    </section>

    <section class="visual-graphic">
      <svg width="200" height="200" viewBox="0 0 100 100" class="jar-svg">
        <!-- Transparent jar scale outline -->
        <path d="M 35 15 L 65 15 L 65 25 C 75 35, 78 50, 75 80 C 72 92, 28 92, 25 80 C 22 50, 25 35, 35 25 Z" fill="none" stroke="#112b4c" stroke-width="1.5" />
        <line x1="32" y1="18" x2="68" y2="18" stroke="#112b4c" stroke-width="1" />
        
        {/* Blue marbles (3) */}
        <circle cx="40" cy="78" r="5" fill="#112b4c" />
        <circle cx="50" cy="80" r="5" fill="#112b4c" />
        <circle cx="60" cy="78" r="5" fill="#112b4c" />
        
        {/* Yellow Marbles (5) */}
        <circle cx="45" cy="70" r="5" fill="#facc15" stroke="#112b4c" stroke-width="0.3" />
        <circle cx="55" cy="72" r="5" fill="#facc15" stroke="#112b4c" stroke-width="0.3" />
        <circle cx="37" cy="65" r="5" fill="#facc15" stroke="#112b4c" stroke-width="0.3" />
        <circle cx="50" cy="62" r="5" fill="#facc15" stroke="#112b4c" stroke-width="0.3" />
        <circle cx="63" cy="67" r="5" fill="#facc15" stroke="#112b4c" stroke-width="0.3" />
        
        {/* Green Marbles (2) */}
        <circle cx="43" cy="54" r="5" fill="#22c55e" stroke="#112b4c" stroke-width="0.3" />
        <circle cx="57" cy="52" r="5" fill="#22c55e" stroke="#112b4c" stroke-width="0.3" />
      </svg>
    </section>

    <section class="choices">
      <div class="choice">
        <span class="choice-letter">(א)</span>
        <span class="choice-text">3/10</span>
      </div>
      <div class="choice">
        <span class="choice-letter">(ב)</span>
        <span class="choice-text">1/2</span>
      </div>
      <div class="choice">
        <span class="choice-letter">(ג)</span>
        <span class="choice-text">4/5</span>
      </div>
      <div class="choice">
        <span class="choice-letter">(ד)</span>
        <span class="choice-text">7/10</span>
      </div>
    </section>

    <section class="solution-lines">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </section>

    <footer class="footer">
      <div class="footer-line"></div>
      <div class="footer-text">תחום וודאות</div>
    </footer>
  </main>
</body>
</html>
