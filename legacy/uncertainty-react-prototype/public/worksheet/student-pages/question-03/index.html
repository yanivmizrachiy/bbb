<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>שאלה 3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="top-header">
      <div class="top-title">שאלה 3</div>
    </header>

    <section class="question-area">
      <h1>לפניכם דיאגרמת עמודות המציגה את התפלגות הציונים במבחן במתמטיקה בכיתה ז׳. מוציאים באקראי תלמיד אחד מהכיתה. מהי ההסתברות שציונו גבוה מ-80?</h1>
    </section>

    <section class="visual-graphic">
      <svg width="280" height="180" viewBox="0 0 120 80" class="chart-svg">
        <line x1="15" y1="10" x2="15" y2="70" stroke="#112b4c" stroke-width="0.5" />
        <line x1="15" y1="70" x2="110" y2="70" stroke="#112b4c" stroke-width="0.5" />
        
        <!-- Grid lines -->
        <line x1="15" y1="50" x2="110" y2="50" stroke="#f1f5f9" stroke-width="0.2" />
        <line x1="15" y1="30" x2="110" y2="30" stroke="#f1f5f9" stroke-width="0.2" />
        
        <!-- Y Axis indicators and labels -->
        <text x="8" y="72" font-size="3" fill="#112b4c" font-family="sans-serif">0</text>
        <text x="8" y="52" font-size="3" fill="#112b4c" font-family="sans-serif">5</text>
        <text x="6" y="32" font-size="3" fill="#112b4c" font-family="sans-serif">10</text>

        <!-- Bar 1 (Grade: 70, Count: 6) -->
        <rect x="25" y="46" width="12" height="24" fill="#cbd5e1" stroke="#112b4c" stroke-width="0.3" />
        <text x="28" y="76" font-size="4.5" fill="#112b4c" font-family="sans-serif">70</text>
        <text x="29" y="42" font-size="3.5" fill="#112b4c" font-family="sans-serif">6</text>

        <!-- Bar 2 (Grade: 80, Count: 10) -->
        <rect x="45" y="30" width="12" height="40" fill="#cbd5e1" stroke="#112b4c" stroke-width="0.3" />
        <text x="48" y="76" font-size="4.5" fill="#112b4c" font-family="sans-serif">80</text>
        <text x="48" y="26" font-size="3.5" fill="#112b4c" font-family="sans-serif">10</text>

        <!-- Bar 3 (Grade: 90, Count: 8) -->
        <rect x="65" y="38" width="12" height="32" fill="#112b4c" stroke="#112b4c" stroke-width="0.3" />
        <text x="68" y="76" font-size="4.5" fill="#112b4c" font-family="sans-serif">90</text>
        <text x="69" y="34" font-size="3.5" fill="#112b4c" font-family="sans-serif">8</text>

        <!-- Bar 4 (Grade: 100, Count: 4) -->
        <rect x="85" y="54" width="12" height="16" fill="#112b4c" stroke="#112b4c" stroke-width="0.3" />
        <text x="86" y="76" font-size="4.5" fill="#112b4c" font-family="sans-serif">100</text>
        <text x="89" y="50" font-size="3.5" fill="#112b4c" font-family="sans-serif">4</text>
      </svg>
    </section>

    <section class="choices">
      <div class="choice">
        <span class="choice-letter">(א)</span>
        <span class="choice-text">3/7</span>
      </div>
      <div class="choice">
        <span class="choice-letter">(ב)</span>
        <span class="choice-text">2/7</span>
      </div>
      <div class="choice">
        <span class="choice-letter">(ג)</span>
        <span class="choice-text">4/7</span>
      </div>
      <div class="choice">
        <span class="choice-letter">(ד)</span>
        <span class="choice-text">1/2</span>
      </div>
    </section>

    <section class="solution-lines">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </section>

    <footer class="footer">
      <div class="footer-line"></div>
      <div class="footer-text">תחום וודאות</div>
    </footer>
  </main>
</body>
</html>
