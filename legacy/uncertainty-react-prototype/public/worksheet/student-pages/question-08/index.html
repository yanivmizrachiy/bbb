<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>שאלה 8</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="top-header">
      <div class="top-title">שאלה 8</div>
    </header>

    <section class="question-area">
      מטילים בו-זמנית שני מטבעות הוגנים בעלי שני צדדים: "עץ" או "פלי". מהי ההסתברות לקבל <strong>לכל היותר</strong> פעם אחת "עץ"?
    </section>

    <section class="graphic-area">
      <svg width="240" height="120" viewBox="0 0 160 80">
        <!-- Coin 1 (Heads "עץ") -->
        <g stroke="#112b4c" stroke-width="0.8">
          <circle cx="50" cy="40" r="24" fill="#f8fafc"/>
          <circle cx="50" cy="40" r="21" fill="none" stroke-dasharray="2,2"/>
          <!-- Branch/Tree emblem representation -->
          <path d="M 50 25 L 50 55 M 50 35 L 40 28 M 50 35 L 60 28 M 50 45 L 38 38 M 50 45 L 62 38" fill="none" stroke-linecap="round"/>
          <text x="50" y="52" font-size="6" font-family="sans-serif" text-anchor="middle" fill="#112b4c" font-weight="bold">עץ</text>
        </g>

        <!-- Plus sign / and sign -->
        <text x="80" y="43" font-size="10" font-family="sans-serif" text-anchor="middle" fill="#112b4c">+</text>

        <!-- Coin 2 (Tails "פלי") -->
        <g stroke="#112b4c" stroke-width="0.8">
          <circle cx="110" cy="40" r="24" fill="#f8fafc"/>
          <circle cx="110" cy="40" r="21" fill="none" stroke-dasharray="2,2"/>
          <!-- Minimalist Harp/Lyre emblem representing coin design -->
          <path d="M 103 27 L 117 27 M 106 27 L 106 48 C 106 52 114 52 114 48 L 114 27 M 110 27 L 110 49" fill="none" stroke-linecap="round"/>
          <text x="110" y="52" font-size="6" font-family="sans-serif" text-anchor="middle" fill="#112b4c" font-weight="bold">פלי</text>
        </g>
      </svg>
    </section>

    <section class="choices">
      <div class="choice">
        <span class="choice-letter">(א)</span>
        <span class="choice-text">1/4</span>
      </div>
      <div class="choice">
        <span class="choice-letter">(ב)</span>
        <span class="choice-text">1/2</span>
      </div>
      <div class="choice">
        <span class="choice-letter">(ג)</span>
        <span class="choice-text">3/4</span>
      </div>
      <div class="choice">
        <span class="choice-letter">(ד)</span>
        <span class="choice-text">1</span>
      </div>
    </section>

    <section class="solution-lines">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </section>

    <footer class="footer">
      <div class="footer-line"></div>
      <div class="footer-text">תחום וודאות</div>
    </footer>
  </main>
</body>
</html>
