services:
  db:
    image: postgres:16
    container_name: bbb-postgres
    environment:
      POSTGRES_USER: bbb
      POSTGRES_PASSWORD: bbb
      POSTGRES_DB: bbb
    ports:
      - "5433:5432"
    volumes:
      - bbb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbb -d bbb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bbb_pgdata:
