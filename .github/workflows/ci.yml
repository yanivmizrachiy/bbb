name: CI

# Quality gate for the Next.js + Postgres app (web/). Runs on every push to
# main and on PRs, so the auto-deploy to Vercel is always backed by green
# type-checks, tests and a production build.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # npm install (not ci) — the lockfile is generated on Windows and omits
        # some Linux-only optional deps; this matches what Vercel's build runs.
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests (parser + PGlite round-trip)
        run: npm test

      - name: Production build (PGlite — no external DB needed)
        run: npm run build
